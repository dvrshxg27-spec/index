<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>♡</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">

<style>
/* ===== COLOURS (change here if you like) ===== */
:root{
  --pale:#FFF0F7; --pastel:#FFD6E9; --medium:#FF8FC7; --strong:#E85CA7; --text:#65314E;
  --font:"Fredoka",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --script:"Pacifico","Brush Script MT",cursive;
  --shadow:0 6px 0 rgba(232,92,167,.16),0 14px 28px rgba(232,92,167,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:var(--font);font-size:17px;line-height:1.5;color:var(--text);background:#000;overflow-x:clip}
body.unlocked{background-color:var(--pale);background-image:radial-gradient(var(--pastel) 2.2px,transparent 2.8px);background-size:28px 28px}
body.noscroll{overflow:hidden}
img,iframe,video{max-width:100%}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ===== PAGE 1: plain black password screen ===== */
#gate{min-height:100vh;min-height:100dvh;background:#000;display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:300px;display:flex;flex-direction:column;gap:12px}
#gate input{width:100%;height:50px;padding:0 14px;border:1px solid #444;border-radius:6px;background:#000;color:#fff;font:400 18px var(--font);text-align:center;outline:none}
#gate input:focus{border-color:#888}
#gate button{height:50px;border:1px solid #444;border-radius:6px;background:#000;color:#fff;font:400 17px var(--font);cursor:pointer}
#gate button:active{background:#1a1a1a}
#err{min-height:1.4em;margin:0;text-align:center;color:#bbb;font-size:15px}

/* ===== shared pink pages ===== */
.page{position:relative;overflow:hidden;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-right,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 40px) calc(env(safe-area-inset-left,0px) + 18px);animation:pageIn .5s ease both}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto}
.wrap.wide{max-width:1000px}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 30px;border:0;border-radius:999px;cursor:pointer;font-weight:600;font-size:1.12rem;color:#fff;text-decoration:none;text-align:center;background:linear-gradient(180deg,#FF8FC7,var(--strong));box-shadow:0 5px 0 #c4468b,0 12px 20px rgba(232,92,167,.32)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c4468b}
.btn.big{min-height:64px;padding:0 36px;font-size:1.28rem}
.btn.soft{color:var(--text);background:#fff;border:2px solid var(--pastel);box-shadow:0 4px 0 var(--pastel);min-height:48px;padding:0 22px;font-size:1rem}
.back{appearance:none;min-height:46px;padding:0 18px;border-radius:999px;cursor:pointer;background:#fff;border:2px solid var(--pastel);color:var(--strong);font-weight:600;box-shadow:0 4px 0 var(--pastel)}
.title{margin:10px 0 6px;text-align:center;font-family:var(--script);font-weight:400;font-size:clamp(1.9rem,8vw,2.5rem);line-height:1.3;color:var(--strong);text-shadow:0 3px 0 #fff;outline:none}
.intro{margin:0 auto 24px;max-width:34ch;text-align:center;opacity:.85}
.empty{margin:20px auto;max-width:380px;padding:28px 22px;text-align:center;background:#fff;border:3px dashed var(--medium);border-radius:28px}
.empty b{display:block;font-size:2.6rem;margin-bottom:6px}
.fl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl span{position:absolute;bottom:-40px;color:var(--medium);opacity:0;animation:up linear infinite}

/* PAGE 2 */
#p-birthday{display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,214,233,.55),transparent 55%)}
.card{position:relative;z-index:1;width:100%;max-width:520px;margin:70px auto 0;padding:34px 22px 30px;text-align:center;background:#fff;border-radius:36px;box-shadow:0 0 0 4px var(--pastel),0 10px 26px rgba(232,92,167,.22)}
.card svg{width:min(46vw,168px);margin:-100px auto 4px;display:block;filter:drop-shadow(0 8px 10px rgba(232,92,167,.3));animation:bob 4s ease-in-out infinite}
.kicker{margin:0;font-family:var(--script);color:var(--medium);font-size:1.2rem}
.hero{margin:6px 0 14px;font-weight:600;line-height:1.15;font-size:clamp(2.1rem,10.5vw,3rem);color:var(--strong);text-shadow:0 3px 0 var(--pastel);text-wrap:balance;outline:none}
.msg{margin:0 0 20px;font-size:1.08rem;white-space:pre-line}
.stickers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 26px;padding:0;list-style:none}
.stickers li{padding:6px 14px;border-radius:999px;font-size:.92rem;background:var(--pale);border:2px dashed var(--medium);transform:rotate(-2deg)}
.stickers li:nth-child(2n){transform:rotate(2.5deg)}

/* PAGE 3 */
.menu{display:grid;gap:22px;margin-top:26px;padding:0 4px}
.mcard{appearance:none;position:relative;display:block;width:100%;text-align:left;cursor:pointer;padding:22px 70px 20px 22px;border:0;border-radius:22px;background:#fff;box-shadow:var(--shadow);transform:rotate(-1deg)}
.mcard:nth-child(2n){transform:rotate(1.2deg)}
.mcard:active{transform:scale(.98)}
.mcard::before{content:"";position:absolute;top:-11px;left:50%;width:82px;height:24px;margin-left:-41px;transform:rotate(-3deg);background:repeating-linear-gradient(45deg,rgba(255,143,199,.6) 0 7px,rgba(255,255,255,.7) 7px 14px)}
.mcard b{display:block;font-size:1.42rem;color:var(--strong)}
.mcard small{display:block;font-size:.98rem;opacity:.8}
.mcard i{position:absolute;right:16px;top:50%;width:40px;height:40px;margin-top:-20px;display:grid;place-items:center;border-radius:50%;background:var(--pastel);color:var(--strong);font-style:normal;font-weight:600}

/* MENU: day counters */
.ctitle{margin:44px 0 4px;text-align:center;font-family:var(--script);font-weight:400;font-size:clamp(1.5rem,6vw,1.9rem);color:var(--strong);text-shadow:0 3px 0 #fff}
.csub{margin:0 0 20px;text-align:center;opacity:.8;font-size:.95rem}
.counters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;padding:0 2px}
.ccard{appearance:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:170px;padding:18px 10px 14px;border:0;cursor:pointer;text-align:center;background:#fff;border-radius:24px;box-shadow:var(--shadow);overflow:hidden;transform:rotate(-1deg);transition:transform .15s}
.ccard:nth-child(2n){transform:rotate(1.2deg)}
.ccard:active{transform:scale(.97)}
.ccard .ce{font-size:1.9rem;line-height:1}
.ccard .cn{display:block;min-height:1.1em;margin-top:6px;font-weight:600;font-size:2.3rem;line-height:1.1;color:var(--strong);font-variant-numeric:tabular-nums}
.ccard .cn.idle{font-size:1.7rem;opacity:.5}
.ccard .cu{display:block;font-size:.8rem;opacity:.7;text-transform:uppercase;letter-spacing:.08em;min-height:1.2em}
.ccard .cl{display:block;margin-top:6px;font-weight:500;font-size:.98rem;line-height:1.25;overflow-wrap:anywhere}
.ccard .ch{position:absolute;bottom:8px;left:0;right:0;font-size:.75rem;opacity:.5}
.ccard.run{animation:cglow 1s ease-in-out infinite alternate}
.ccard.done .cn{animation:cpop .5s ease both}
.burst{position:absolute;left:50%;top:50%;pointer-events:none;color:var(--medium);font-size:16px;opacity:0;animation:burst .9s ease-out forwards}
@keyframes cglow{from{box-shadow:var(--shadow)}to{box-shadow:0 0 0 4px var(--pastel),0 12px 28px rgba(232,92,167,.4)}}
@keyframes cpop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3)}}
@media(min-width:700px){.counters{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Done button (menu page) + final video page */
#p-menu{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
.donebtn{appearance:none;position:fixed;z-index:20;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);min-height:56px;padding:0 30px;border:0;border-radius:999px;cursor:pointer;font-weight:600;font-size:1.15rem;color:#fff;background:linear-gradient(180deg,#FF8FC7,var(--strong));box-shadow:0 5px 0 #c4468b,0 12px 20px rgba(232,92,167,.4)}
.donebtn:active{transform:translateY(4px);box-shadow:0 1px 0 #c4468b}
.fcard{padding:12px;background:#fff;border-radius:26px;box-shadow:var(--shadow)}
.fbox{border-radius:16px}
.note2{margin:14px 4px 0;font-size:.92rem;text-align:center;opacity:.85}

/* MENU: links to old sites */
.sites{display:grid;gap:16px;padding:0 4px}
.scard{position:relative;display:flex;align-items:center;gap:14px;padding:16px 64px 16px 16px;border-radius:22px;background:#fff;color:inherit;text-decoration:none;box-shadow:var(--shadow);transform:rotate(-.8deg)}
.scard:nth-child(2n){transform:rotate(1deg)}
.scard:active{transform:scale(.98)}
.scard .se{flex:none;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:var(--pastel);font-size:1.5rem}
.scard .st{min-width:0}
.scard b{display:block;font-size:1.15rem;color:var(--strong);overflow-wrap:anywhere}
.scard small{display:block;font-size:.92rem;opacity:.8}
.scard i{position:absolute;right:16px;top:50%;width:36px;height:36px;margin-top:-18px;display:grid;place-items:center;border-radius:50%;background:var(--pastel);color:var(--strong);font-style:normal;font-weight:600}
@media(min-width:700px){.sites{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* PAGE 4 photos */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px;padding:6px 2px 0}
.pol{appearance:none;position:relative;display:block;width:100%;padding:8px 8px 10px;border:0;cursor:pointer;text-align:center;background:#fff;border-radius:10px;box-shadow:0 6px 16px rgba(101,49,78,.16);transform:rotate(-1.5deg)}
.pol:nth-child(3n+2){transform:rotate(1.6deg)}.pol:nth-child(3n){transform:rotate(-.6deg)}
.pol:active{transform:scale(.97)}
.pol::before{content:"";position:absolute;top:-10px;left:50%;width:56px;height:20px;margin-left:-28px;z-index:2;transform:rotate(4deg);background:rgba(255,143,199,.55)}
.pimg{position:relative;display:block;aspect-ratio:1/1;overflow:hidden;border-radius:6px;background:var(--pastel)}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{display:block;min-height:1.5em;margin-top:8px;font-size:.92rem;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.fail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;text-align:center;font-size:.82rem;color:var(--strong);background:var(--pastel)}

/* PAGE 5 videos */
.vgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.vcard{appearance:none;display:block;width:100%;padding:10px 10px 14px;border:0;cursor:pointer;text-align:left;background:#fff;border-radius:22px;box-shadow:var(--shadow);text-decoration:none;color:inherit}
.vthumb{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:linear-gradient(135deg,var(--pastel),var(--medium))}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vthumb em{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.94);color:var(--strong);font-style:normal;font-size:1.6rem;padding-left:4px;box-shadow:0 6px 18px rgba(101,49,78,.3)}
.vtitle{display:block;margin:12px 6px 0;font-weight:600;font-size:1.12rem;overflow-wrap:anywhere}
.vdesc{display:block;margin:2px 6px 0;opacity:.8;font-size:.95rem}

/* PAGE 6 songs */
#p-songs{background:linear-gradient(180deg,#ffc6e2,transparent 70%)}
.slist{display:grid;gap:20px;margin:0;padding:0;list-style:none}
.song{padding:16px;background:#fff;border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.shead{display:flex;align-items:center;gap:14px}
.disc{flex:none;position:relative;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,var(--medium) 0 17%,#2b1624 18% 22%,#3b2030 23% 40%,#24121d 41% 58%,#3b2030 59% 100%)}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#fff}
.song.open .disc{animation:spin 5s linear infinite}
.song h2{margin:0;font-size:1.16rem;color:var(--strong);overflow-wrap:anywhere}
.song p{margin:0}
.song .artist{opacity:.8;font-size:.95rem}
.song .note{margin:12px 2px 0;font-style:italic;white-space:pre-line}
.sact{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.sact .btn{min-height:46px;padding:0 20px;font-size:1rem}
.splayer{margin-top:14px}
.splayer iframe{display:block;width:100%;border:0;border-radius:16px}
.box{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:16px;background:#1b0f17}
.box iframe,.box video{position:absolute;inset:0;width:100%;height:100%;border:0}

/* PAGE 7 letters */
#p-letters{background:linear-gradient(180deg,rgba(255,214,233,.6),transparent 60%)}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px;padding:8px 2px 0}
.env{appearance:none;position:relative;display:block;width:100%;min-height:138px;padding:56px 10px 14px;border:0;cursor:pointer;text-align:center;background:#fff;border-radius:6px 6px 14px 14px;box-shadow:0 6px 0 rgba(232,92,167,.18),0 12px 22px rgba(232,92,167,.16);transform:rotate(-1deg);font-weight:500;font-size:.95rem;line-height:1.3;color:var(--text)}
.env:nth-child(2n){transform:rotate(1.2deg)}
.env:active{transform:scale(.97)}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:54px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--pastel),#ffe7f2);clip-path:polygon(0 0,100% 0,50% 100%)}
.env::after{content:"♥";position:absolute;left:50%;top:30px;width:30px;height:30px;margin-left:-15px;display:grid;place-items:center;border-radius:50%;background:var(--strong);color:#fff;font-size:.95rem}
.env span{position:relative;overflow-wrap:anywhere}

/* pop-ups */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow-y:auto;padding:14px;background:rgba(60,20,45,.62);animation:fade .2s both}
.modal{position:relative;width:100%;max-width:560px;max-height:100%;animation:pop .3s both}
.x{position:absolute;top:-6px;right:-4px;z-index:3;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;background:#fff;color:var(--strong);font-size:1.3rem;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.paper{position:relative;padding:30px 24px 24px;border-radius:22px;background:#fffdf8;text-align:left;background-image:repeating-linear-gradient(transparent 0 31px,rgba(255,143,199,.28) 31px 32px);background-position:0 14px;box-shadow:0 0 0 4px var(--pastel),0 10px 26px rgba(232,92,167,.3);max-height:calc(100dvh - 100px);overflow-y:auto}
.paper h2{margin:8px 40px 14px 0;font-family:var(--script);font-weight:400;font-size:1.45rem;line-height:1.4;color:var(--strong);overflow-wrap:anywhere}
.paper p{margin:0;line-height:32px;font-size:1.05rem;white-space:pre-line;overflow-wrap:anywhere}
.paper .sig{margin-top:14px;font-family:var(--script);color:var(--strong);line-height:1.7}
.vmodal{max-width:760px;padding:14px;background:#fff;border-radius:26px}
.vmodal h2{margin:6px 44px 12px 6px;font-size:1.2rem;color:var(--strong)}
.vmodal .note2{margin:12px 4px 0;font-size:.92rem;text-align:center;opacity:.85}
.lb{max-width:900px;text-align:center;color:#fff}
.lb img{display:block;margin:0 auto;max-width:100%;max-height:66dvh;object-fit:contain;border-radius:14px;border:6px solid #fff;background:var(--pastel)}
.lb .fl2{padding:30px 20px;border-radius:20px;background:#fff;color:var(--text);max-width:340px;margin:0 auto}
.lb .c{margin:14px 8px 0;font-weight:600;font-size:1.1rem}
.lb .nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px}
.lb .nav button{width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;background:#fff;color:var(--strong);font-size:1.4rem;font-weight:600}
.lb .nav button:disabled{opacity:.35}
.lb a{color:#fff}

@media(min-width:700px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 22px}.vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.menu{grid-template-columns:1fr 1fr}.wrap.menuw{max-width:800px}}
@media(min-width:1000px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes up{0%{transform:translateY(0);opacity:0}12%{opacity:.5}90%{opacity:.5}100%{transform:translateY(-115vh);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.fl{display:none}}
</style>
</head>

<body>

<!-- ============ PAGE 1: plain black password screen ============ -->
<div id="gate">
  <form id="form" autocomplete="off">
    <input id="pw" type="password" placeholder="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Password">
    <button type="submit">Unlock</button>
    <p id="err" role="alert"></p>
  </form>
</div>

<div id="app" hidden></div>
<div id="modal-root"></div>

<script>
/* ==========================================================================
   ✏️  EDIT EVERYTHING HERE  (this is the only part you need to touch)
   • Keep the "quotes" and the commas.
   • To delete an item, delete its whole { ... }, line.
   • To reorder, cut/paste whole lines.
   • {name} in any text becomes her nickname, {from} becomes your name.
   ========================================================================== */

// 🔑 THE PASSWORD — change the text between the quotes.
// (Capital letters don't matter: "OurLove" and "ourlove" both work.)
var PASSWORD = "ourlove";

var NICKNAME = "Princess";
var YOUR_NAME = "Your Name";

var BIRTHDAY_HEADING = "Happy Birthday, My Love! 🎂💗";
var BIRTHDAY_MESSAGE =
  "Today is all about you, {name}. You make my ordinary days feel like little celebrations, " +
  "and I made this tiny corner of the internet just to say thank you for being you.\n\n" +
  "Come on in — I've hidden a few surprises inside. 🎀";
var BIRTHDAY_BUTTON = "Open your surprise ♡";
var STICKERS = ["✨ made with love", "🎀 just for you", "💗 100% yours"];

/* 📸 PHOTOS
   1. Upload the photo to Google Drive.
   2. Right-click it → Share → General access → "Anyone with the link" → Viewer.
   3. Click "Copy link" and paste it as the url.
   Use a link to ONE FILE (not a folder). */
var PHOTOS = [
  // { title: "Our favourite picture", url: "https://drive.google.com/file/d/PASTE_FILE_ID/view?usp=sharing" },
  // { title: "That sunny day",        url: "https://drive.google.com/file/d/PASTE_FILE_ID/view?usp=sharing" },
];

/* 🎥 VIDEOS — same as photos (Drive links; YouTube links also work).
   A brand-new Drive video can take a few minutes before it plays. */
var VIDEOS = [
  // { title: "That funny moment", url: "https://drive.google.com/file/d/PASTE_FILE_ID/view?usp=sharing" },
];

/* 🎧 SONGS — Spotify or YouTube links. "artist" and "note" are optional. */
var SONGS = [
  // { title: "Song name", artist: "Artist", url: "https://open.spotify.com/track/PASTE_TRACK_ID", note: "Why this reminds me of you" },
  // { title: "Another song", url: "https://www.youtube.com/watch?v=PASTE_VIDEO_ID" },
];

/* ⏳ DAY COUNTERS (shown on the menu page; tap one to watch the days count up)
   Two ways to fill each one in:
   • days: 123            → a fixed number you type yourself
   • date: "2023-02-14"   → (YYYY-MM-DD) it works out the days automatically
                            and keeps growing every day
   If you give both, "date" wins. "emoji" is optional. */
var COUNTERS_TITLE = "Our Little Counters";
var COUNTERS_SUBTITLE = "Tap one to count the days ♡";
var COUNTERS = [
  { label: "days since you were born",   emoji: "🎂", days: 9000 },
  { label: "days since we've been together", emoji: "💑", days: 500 },
  { label: "days since our first kiss",  emoji: "💋", days: 480 }
];

/* 🔗 OLD SITES — links to the other sites you made for her.
   Paste each site's address as the url. "note" and "emoji" are optional.

      if (yt) return { t: t, kind: 'yt', embed: ytEmbed(yt), orig: ytOpen(yt), thumb: yt.list ? [] : ['https://i.ytimg.com/vi/' + yt.id + '/hqdefault.jpg'] };
      if (u && !/\/folders\//.test(u.pathname)) return { t: t, kind: /\.(mp4|webm|mov|m4v)$/i.test(u.pathname) ? 'file' : 'link', embed: u.href, orig: u.href, thumb: [] };

    if (!list.length) { s.wrap.appendChild(empty('🎬', 'Our videos are still being wrapped up with a bow. Check back soon ♡')); return s.sec; }

        h('a', { class: 'btn soft', href: v.orig, target: '_blank', rel: 'noopener noreferrer', text: v.kind === 'drive' ? 'Open in Google Drive ↗' : 'Open video ↗' }),
        h('button', { class: 'btn', type: 'button', text: 'Close', onclick: close })));

  /* ---------- PAGE 6: songs ---------- */
  function pSongs() {
    var list = good(SONGS, function (g) {
      var sp = spRef(g && g.url), yt = ytRef(g && g.url), u = url(g && g.url), base = { t: (g && g.title) || 'A song for you', a: (g && g.artist) || '', n: (g && g.note) || '' };
      if (sp) { base.embed = 'https://open.spotify.com/embed/' + sp.t + '/' + sp.id; base.hgt = (sp.t === 'track' || sp.t === 'episode') ? 152 : 352; base.orig = 'https://open.spotify.com/' + sp.t + '/' + sp.id; base.label = 'Open in Spotify'; return base; }

    if (!list.length) { s.wrap.appendChild(empty('🎶', 'Our playlist is still being made, one song at a time. Check back soon ♡')); return s.sec; }
    var openOne = null;   // only one player at a time, and nothing plays until she taps

      function open() {

        if (g.hgt) { f.setAttribute('height', g.hgt); pl.appendChild(f); } else pl.appendChild(h('div', { class: 'box' }, f));
        pl.hidden = false; li.classList.add('open'); btn.textContent = '✕ Hide player'; openOne = shut;
      }
      var acts = h('div', { class: 'sact' });
      if (g.embed) { btn = h('button', { class: 'btn', type: 'button', text: '▶ Listen here', onclick: function () { if (li.classList.contains('open')) { shut(); openOne = null; } else open(); } }); acts.appendChild(btn); }
      acts.appendChild(h('a', { class: 'btn soft', href: g.orig, target: '_blank', rel: 'noopener noreferrer', text: g.label + ' ↗' }));

  }

  /* ---------- PAGE 7: letters ---------- */
  function pLetters() {
    var list = LETTERS.filter(function (l) { return l && l.title; });
    var s = shell('letters', true, ['💌', '💗', '✨', '♡', '🎀'], 'Little Letters 💌', 'Open one whenever you need it ♡');
    if (!list.length) { s.wrap.appendChild(empty('💌', 'My letters are still being written. Check back soon ♡')); return s.sec; }
    s.wrap.appendChild(h('div', { class: 'lgrid' }, list.map(function (l) {
      return h('button', { class: 'env', type: 'button', 'aria-label': l.title, onclick: function () { letter(l); } }, h('span', { text: T(l.title) }));
    })));
    return s.sec;
  }

      dlg.appendChild(h('div', { class: 'paper' }, h('h2', { text: T(l.title) }), h('p', { text: T(l.message || 'This letter is still being written ♡') }), sig ? h('p', { class: 'sig', text: sig }) : null));
      dlg.appendChild(h('div', { class: 'acts' }, h('button', { class: 'btn', type: 'button', text: '← Back to letters', onclick: close })));
    });
  }
})();
